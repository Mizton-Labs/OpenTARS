name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create virtualenv and install dependencies
        run: uv venv .venv && uv pip install -r backend/requirements.txt --python .venv/bin/python

      - name: Run pytest
        run: PYTHONPATH=${{ github.workspace }} .venv/bin/pytest backend/tests -v --tb=short

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run vitest
        run: npm --prefix frontend test

  lint:
    name: Lint (Ruff + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: shellcheck (launcher)
        run: shellcheck opentars mizton-threatbox docker/build/build.sh docker/build/docker-entrypoint.sh scripts/check.sh scripts/security-check.sh scripts/test.sh
